      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
  </defs>
  <rect width="680" height="170" rx="20" fill="url(#base)"/>
  <rect width="680" height="170" rx="20" fill="url(#magenta)"/>
  <rect width="680" height="170" rx="20" fill="url(#cyan)"/>
  <rect x="0.5" y="0.5" width="679" height="169" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  <text x="340" y="72" text-anchor="middle" font-size="18" fill="#fff" fill-opacity="0.75">Welcome, respected brother.</text>
  <text x="340" y="118" text-anchor="middle" font-size="40" font-weight="800" fill="url(#accent)">I'm H. Blanqueto</text>
