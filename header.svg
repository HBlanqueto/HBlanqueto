<svg xmlns="http://www.w3.org/2000/svg" width="680" height="170" viewBox="0 0 680 170" role="img" aria-labelledby="title">
  <title id="title">Welcome, respected brother. I'm H. Blanqueto</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0a2e"/>
      <stop offset="1" stop-color="#0c1030"/>
    </linearGradient>
    <radialGradient id="magenta" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ff3ccf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3ccf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.9" cy="1" r="0.7">
      <stop offset="0" stop-color="#39c8ff" stop-opacity="0.35"/>
